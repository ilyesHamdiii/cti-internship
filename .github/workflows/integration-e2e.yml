name: Integration and E2E Tests

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-e2e:
    name: Runtime integration, DAST, and Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend test dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Install Playwright runner
        run: |
          npm ci --prefix frontend
          npm install --no-save @playwright/test@1.46.1
          npx playwright install --with-deps chromium

      - name: Create CI environment
        run: bash scripts/ci/write-ci-env.sh

      - name: Start full stack with MISP
        run: docker compose --profile misp up -d --build

      - name: Wait for platform and MISP
        run: bash scripts/ci/wait-for-stack.sh backend postgres redis nginx frontend worker scheduler misp misp-db misp-valkey misp-modules

      - name: Apply migrations and seed demo data
        run: |
          docker compose exec -T backend alembic upgrade head
          docker compose exec -T backend python -m app.scripts.bootstrap_demo
          docker compose exec -T backend python -m app.scripts.misp_scenario powershell

      - name: Run integration tests
        env:
          RUN_INTEGRATION_TESTS: "1"
          E2E_BASE_URL: http://localhost:8080
          E2E_ADMIN_EMAIL: admin@example.com
          E2E_ADMIN_PASSWORD: ChangeMe123!
        run: pytest tests/integration --junitxml=artifacts/integration-junit.xml

      - name: Run OWASP ZAP baseline DAST
        run: bash scripts/ci/run-zap-baseline.sh

      - name: Run Playwright E2E tests
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_ADMIN_EMAIL: admin@example.com
          E2E_ADMIN_PASSWORD: ChangeMe123!
        run: npx playwright test tests/e2e --config=tests/e2e/playwright.config.ts

      - name: Collect logs on failure
        if: failure()
        run: bash scripts/ci/collect-compose-logs.sh

      - name: Upload runtime reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-e2e-security-reports
          path: |
            artifacts
            test-results
            playwright-report

      - name: Tear down
        if: always()
        run: docker compose --profile misp down -v --remove-orphans
