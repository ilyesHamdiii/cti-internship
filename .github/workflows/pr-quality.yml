name: Pull Request Quality Checks

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  backend-quality:
    name: Backend lint, type check, and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Python syntax validation
        run: python -m compileall app

      - name: Ruff lint
        run: ruff check app ../scripts/backend

      - name: Ruff format check
        run: ruff format --check app ../scripts/backend

      - name: mypy
        run: mypy app

      - name: Backend unit tests
        run: |
          mkdir -p ../artifacts
          pytest ../scripts/backend --junitxml=../artifacts/backend-unit-junit.xml

      - name: Upload backend test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-test-report
          path: artifacts/backend-unit-junit.xml

  frontend-quality:
    name: Frontend lint, type check, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        run: npm ci

      - name: npm lint
        run: npm run lint

      - name: TypeScript type checking
        run: npx tsc --noEmit

      - name: Frontend production build
        run: npm run build
