sonar.projectKey=cti-detection-engineering-platform
sonar.projectName=CTI Detection Engineering Platform
sonar.projectVersion=0.1.0

sonar.sources=backend,frontend,docker,.github/workflows
sonar.tests=scripts/backend,tests/integration,tests/e2e
sonar.exclusions=**/__pycache__/**,**/.next/**,**/node_modules/**,**/artifacts/**,docs/academic report/template/**,backend/alembic/versions/**
sonar.test.inclusions=scripts/backend/**/*.py,tests/**/*.py,tests/**/*.ts

sonar.python.version=3.11
sonar.python.coverage.reportPaths=artifacts/coverage/coverage.xml
sonar.javascript.lcov.reportPaths=artifacts/coverage/lcov.info

sonar.sourceEncoding=UTF-8
sonar.qualitygate.wait=true
sonar.coverage.exclusions=frontend/**/*.config.*,frontend/next-env.d.ts,backend/alembic/**,backend/app/scripts/**
sonar.cpd.exclusions=backend/alembic/versions/**
