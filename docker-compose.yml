services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cti
      POSTGRES_USER: cti
      POSTGRES_PASSWORD: cti
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cti -d cti"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - platform_internal

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - platform_internal

  backend:
    build:
      context: ./backend
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - deployment_artifacts:/artifacts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - platform_internal
      - misp_internal

  worker:
    build:
      context: ./backend
    env_file: .env
    command: ["celery", "-A", "app.workers.celery_app.celery_app", "worker", "--loglevel=INFO"]
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - deployment_artifacts:/artifacts
    networks:
      - platform_internal
      - misp_internal

  scheduler:
    build:
      context: ./backend
    env_file: .env
    command: ["celery", "-A", "app.workers.celery_app.celery_app", "beat", "--loglevel=INFO"]
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - platform_internal
      - misp_internal

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: /api/v1
    networks:
      - platform_internal

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - platform_internal

  misp:
    image: ghcr.io/misp/misp-docker/misp-core:${MISP_CORE_RUNNING_TAG:-latest}
    container_name: cti-misp-core
    profiles: ["misp"]
    restart: unless-stopped
    depends_on:
      misp-valkey:
        condition: service_healthy
      misp-db:
        condition: service_healthy
      misp-modules:
        condition: service_healthy
    ports:
      - "${MISP_CORE_HTTP_PORT:-8081}:80"
      - "${MISP_CORE_HTTPS_PORT:-8443}:443"
    volumes:
      - misp_configs:/var/www/MISP/app/Config
      - misp_logs:/var/www/MISP/app/tmp/logs
      - misp_files:/var/www/MISP/app/files
      - misp_ssl:/etc/nginx/certs
      - misp_gnupg:/var/www/MISP/.gnupg
    environment:
      BASE_URL: ${MISP_BASE_URL:-https://localhost:8443}
      ADMIN_EMAIL: ${MISP_ADMIN_EMAIL:-admin@admin.test}
      ADMIN_PASSWORD: ${MISP_ADMIN_PASSWORD:-admin}
      ADMIN_KEY: ${MISP_ADMIN_KEY:-}
      ADMIN_ORG: ${MISP_ADMIN_ORG:-CTI Local}
      MISP_EMAIL: ${MISP_EMAIL:-misp@localhost}
      MISP_CONTACT: ${MISP_CONTACT:-misp@localhost}
      GPG_PASSPHRASE: ${MISP_GPG_PASSPHRASE:-misp-local-passphrase}
      ENCRYPTION_KEY: ${MISP_ENCRYPTION_KEY:-}
      SALT: ${MISP_SALT:-}
      UUID: ${MISP_UUID:-}
      DISABLE_SSL_REDIRECT: ${MISP_DISABLE_SSL_REDIRECT:-false}
      ENABLE_DB_SETTINGS: ${MISP_ENABLE_DB_SETTINGS:-true}
      MYSQL_HOST: misp-db
      MYSQL_PORT: 3306
      MYSQL_USER: ${MISP_MYSQL_USER:-misp}
      MYSQL_PASSWORD: ${MISP_MYSQL_PASSWORD:-example}
      MYSQL_DATABASE: ${MISP_MYSQL_DATABASE:-misp}
      REDIS_HOST: misp-valkey
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${MISP_REDIS_PASSWORD:-redispassword}
      MISP_MODULES_FQDN: http://misp-modules
      SMTP_FQDN: misp-mail
      SMTP_PORT: 25
      TZ: ${TZ:-UTC}
    healthcheck:
      test: ["CMD-SHELL", "curl -ks https://localhost/users/heartbeat >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 180s
    networks:
      - misp_internal

  misp-modules:
    image: ghcr.io/misp/misp-docker/misp-modules:${MISP_MODULES_RUNNING_TAG:-latest}
    container_name: cti-misp-modules
    profiles: ["misp"]
    restart: unless-stopped
    environment:
      REDIS_BACKEND: misp-valkey
      REDIS_PORT: 6379
      REDIS_PW: ${MISP_REDIS_PASSWORD:-redispassword}
      TZ: ${TZ:-UTC}
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:6666/modules', timeout=5).read()\""]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 60s
    networks:
      - misp_internal

  misp-db:
    image: mariadb:10.11
    container_name: cti-misp-db
    profiles: ["misp"]
    restart: unless-stopped
    command:
      - --innodb-buffer-pool-size=${MISP_INNODB_BUFFER_POOL_SIZE:-1024M}
      - --innodb-change-buffering=${MISP_INNODB_CHANGE_BUFFERING:-none}
      - --innodb-io-capacity=${MISP_INNODB_IO_CAPACITY:-1000}
      - --innodb-io-capacity-max=${MISP_INNODB_IO_CAPACITY_MAX:-2000}
      - --innodb-log-file-size=${MISP_INNODB_LOG_FILE_SIZE:-600M}
    environment:
      MYSQL_USER: ${MISP_MYSQL_USER:-misp}
      MYSQL_PASSWORD: ${MISP_MYSQL_PASSWORD:-example}
      MYSQL_ROOT_PASSWORD: ${MISP_MYSQL_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: ${MISP_MYSQL_DATABASE:-misp}
      TZ: ${TZ:-UTC}
    volumes:
      - misp_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin --user=$$MYSQL_USER --password=$$MYSQL_PASSWORD status >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - misp_internal

  misp-valkey:
    image: valkey/valkey:7.2
    container_name: cti-misp-valkey
    profiles: ["misp"]
    restart: unless-stopped
    command: ["valkey-server", "--requirepass", "${MISP_REDIS_PASSWORD:-redispassword}"]
    environment:
      MISP_REDIS_PASSWORD: ${MISP_REDIS_PASSWORD:-redispassword}
      TZ: ${TZ:-UTC}
    volumes:
      - misp_cache_data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$${MISP_REDIS_PASSWORD:-redispassword}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - misp_internal

  misp-mail:
    image: ghcr.io/egos-tech/smtp:1.1.3
    container_name: cti-misp-mail
    profiles: ["misp"]
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
    networks:
      - misp_internal

networks:
  platform_internal:
  misp_internal:

volumes:
  postgres_data:
  redis_data:
  deployment_artifacts:
  misp_mysql_data:
  misp_cache_data:
  misp_configs:
  misp_logs:
  misp_files:
  misp_ssl:
  misp_gnupg:
